services:
  dispatch-agent-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: dispatch-agent-ai:latest
    container_name: dispatch-agent-ai
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - AWS_REGION=us-east-1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
